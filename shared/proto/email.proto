syntax = "proto3";

package email;

option go_package = "github.com/RAF-SI-2025/EXBanka-4-Backend/shared/pb/email";

message SendActivationEmailRequest {
  string email           = 1;
  string first_name      = 2;
  string activation_link = 3;
}

message SendActivationEmailResponse {}

message SendPasswordResetEmailRequest {
  string email      = 1;
  string first_name = 2;
  string reset_link = 3;
}
message SendPasswordResetEmailResponse {}

message SendAccountCreatedEmailRequest {
  string email          = 1;
  string first_name     = 2;
  string account_name   = 3;
  string account_number = 4;
  string currency_code  = 5;
}

message SendAccountCreatedEmailResponse {}

message SendCardConfirmationEmailRequest {
  string email            = 1;
  string first_name       = 2;
  string confirmation_code = 3;
}
message SendCardConfirmationEmailResponse {}

message SendLoanLatePaymentEmailRequest {
  string email       = 1;
  string first_name  = 2;
  string loan_number = 3;
  double amount_due  = 4;
  string currency    = 5;
  int32  retry_count = 6;
}
message SendLoanLatePaymentEmailResponse {}

message SendAccountLockedEmailRequest {
  string email              = 1;
  string first_name         = 2;
  string password_reset_link = 3;
}
message SendAccountLockedEmailResponse {}

message SendPaymentNotificationEmailRequest {
  string email            = 1;
  string first_name       = 2;
  string direction        = 3;  // "incoming" | "outgoing"
  double amount           = 4;
  string currency         = 5;
  string counterparty     = 6;
  string account_number   = 7;
}
message SendPaymentNotificationEmailResponse {}

message SendCardBlockedEmailRequest {
  string email            = 1;
  string first_name       = 2;
  string card_number      = 3;  // masked, e.g. **** **** **** 1234
}
message SendCardBlockedEmailResponse {}

message SendLoanApprovedEmailRequest {
  string email               = 1;
  string first_name          = 2;
  double loan_amount         = 3;
  string currency            = 4;
  double monthly_installment = 5;
}
message SendLoanApprovedEmailResponse {}

message SendLimitChangeEmailRequest {
  string email         = 1;
  string first_name    = 2;
  double daily_limit   = 3;
  double monthly_limit = 4;
  string currency      = 5;
}
message SendLimitChangeEmailResponse {}

service EmailService {
  rpc SendActivationEmail(SendActivationEmailRequest)                 returns (SendActivationEmailResponse);
  rpc SendPasswordResetEmail(SendPasswordResetEmailRequest)           returns (SendPasswordResetEmailResponse);
  // Reuses SendActivationEmailRequest (email + first_name); activation_link left empty.
  rpc SendPasswordConfirmationEmail(SendActivationEmailRequest)       returns (SendActivationEmailResponse);
  rpc SendAccountCreatedEmail(SendAccountCreatedEmailRequest)         returns (SendAccountCreatedEmailResponse);
  rpc SendCardConfirmationEmail(SendCardConfirmationEmailRequest)     returns (SendCardConfirmationEmailResponse);
  rpc SendLoanLatePaymentEmail(SendLoanLatePaymentEmailRequest)       returns (SendLoanLatePaymentEmailResponse);
  rpc SendAccountLockedEmail(SendAccountLockedEmailRequest)           returns (SendAccountLockedEmailResponse);
  rpc SendPaymentNotificationEmail(SendPaymentNotificationEmailRequest) returns (SendPaymentNotificationEmailResponse);
  rpc SendCardBlockedEmail(SendCardBlockedEmailRequest)               returns (SendCardBlockedEmailResponse);
  rpc SendLoanApprovedEmail(SendLoanApprovedEmailRequest)             returns (SendLoanApprovedEmailResponse);
  rpc SendLimitChangeEmail(SendLimitChangeEmailRequest)               returns (SendLimitChangeEmailResponse);
}
